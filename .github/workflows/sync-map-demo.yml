name: Inspeccionar map_demo

on:
  push:
    branches: [sol_sim]
    paths:
      - .github/workflows/sync-map-demo.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar rama destino
        uses: actions/checkout@v4
        with:
          ref: sol_sim
          fetch-depth: 0
      - name: Descargar rama origen
        run: git clone --depth 1 --branch map_demo https://github.com/LuisMAC2022/map.git /tmp/map-demo
      - name: Guardar contexto de controles
        shell: bash
        run: |
          python3 - <<'PY' > CONTROL_CONTEXT.txt
          from pathlib import Path

          root = Path('/tmp/map-demo')
          needles = ('Ver simulación', 'Editar texto')
          found = False
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
              if not hits:
                  continue
              found = True
              print(f'FILE: {path.relative_to(root)}')
              for hit in hits:
                  start = max(0, hit - 16)
                  end = min(len(lines), hit + 17)
                  print(f'--- contexto línea {hit + 1} ---')
                  for number in range(start, end):
                      print(f'{number + 1:04d}: {lines[number]}')
          if not found:
              raise SystemExit('No se encontraron los textos solicitados')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CONTROL_CONTEXT.txt
          git commit -m "Registra contexto de controles"
          git push origin HEAD:sol_sim
