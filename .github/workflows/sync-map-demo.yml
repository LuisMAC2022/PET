name: Inspeccionar map_demo

on:
  pull_request:
    branches: [sol_sim]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: agent/map-demo-sync
          fetch-depth: 0
      - name: Descargar rama origen
        run: git clone --depth 1 --branch map_demo https://github.com/LuisMAC2022/map.git /tmp/map-demo
      - name: Guardar contexto objetivo
        shell: bash
        run: |
          python3 - <<'PY' > TARGET_CONTEXT.txt
          from pathlib import Path
          import unicodedata

          root = Path('/tmp/map-demo')
          found = False
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              normalized = [unicodedata.normalize('NFD', line.lower()).encode('ascii', 'ignore').decode() for line in lines]
              hits = [i for i, line in enumerate(normalized) if ('editar' in line or ('ver' in line and ('simulacion' in line or 'simulador' in line)))]
              if not hits:
                  continue
              found = True
              print(f'FILE: {path.relative_to(root)}')
              windows = []
              for hit in hits:
                  start = max(0, hit - 24)
                  end = min(len(lines), hit + 25)
                  if windows and start <= windows[-1][1]:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], end))
                  else:
                      windows.append((start, end))
              for start, end in windows:
                  print(f'--- líneas {start + 1}-{end} ---')
                  for number in range(start, end):
                      print(f'{number + 1:04d}: {lines[number]}')
          if not found:
              print('No se encontraron coincidencias.')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TARGET_CONTEXT.txt
          git commit -m "Registra contexto objetivo"
          git push origin HEAD:agent/map-demo-sync
